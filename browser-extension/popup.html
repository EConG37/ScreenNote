<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接 ScreenNote</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="brand"><img src="icons/icon-32.png" width="28" height="28" alt="拾屏图标"><div class="eyebrow">SCREENNOTE / 网页连接</div></div>
  <h1>截图之后，继续提问。</h1>
  <p>启动桌面工具，在设置里查看配对码。连接后，文字或多张截图会放进你选择的 AI 网页草稿，由你检查并发送。</p>
  <form id="pair-form">
    <label for="pair-code">桌面工具中的 6 位配对码</label>
    <input id="pair-code" name="pair-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="输入配对码" required>
    <button type="submit" id="connect">连接桌面工具</button>
  </form>
  <div id="status" role="status" aria-live="polite">正在检查连接…</div>
  <label for="target">打开 AI 网页</label>
  <select id="target"><option value="deepseek">DeepSeek</option><option value="chatgpt">ChatGPT</option><option value="doubao">豆包</option></select>
  <div class="actions">
    <button type="button" id="open" class="secondary">打开所选网页</button>
    <button type="button" id="disconnect" class="secondary">断开连接</button>
  </div>
  <p class="footnote">配对一次后，桌面工具或浏览器重启会自动恢复连接。点击断开连接或在桌面重置配对会取消授权。扩展只连接本机及所列 AI 网站，不调用模型 API。</p>
  <script src="popup.js"></script>
</body>
</html>
